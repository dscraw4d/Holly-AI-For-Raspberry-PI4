   }

  }

  r.onresult=e=>{if(recognition!==r)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)micFinal+=' '+e.results[i][0].transcript;else interim+=' '+e.results[i][0].transcript;}const text=plainTranscript([micBase,micFinal,interim].join(' '));input.value=text.slice(0,319);r.tooLong=text.length>319;if(r.tooLong)note('Transcript trimmed to 319 characters. Review it before sending.');};
  r.onerror=e=>{if(recognition!==r)return;r.failed=true;if(e.error!=='no-speech')handsFreePaused=true;const messages={'not-allowed':'Microphone permission denied. Allow microphone access for this Holly page in Chrome site settings.','audio-capture':'No working microphone found. Check your Windows input device.','network':'Speech recognition service could not be reached. Check your internet connection.','no-speech':'No speech heard. Click Talk to Holly to retry.','language-not-supported':'The selected recognition language is unavailable.'};note(messages[e.error]||('Recognition stopped: '+e.error));};
  r.onend=()=>{
   if(recognition!==r)return;recognition=null;listening=false;micPreparing=false;updateMic();
   const finalText=plainTranscript([micBase,micFinal].join(' '));
   if(micFinal.trim()&&!r.failed){input.value=finalText.slice(0,319);if(autoSend.checked&&!r.tooLong&&finalText.length<=319){note('Sending your spoken message to Holly...');return chat(input.value);}note(r.tooLong?'Transcript is too long. Review/edit it, then Send.':'Review your words, then Send.');}
   input.focus();scheduleListening();
  };
  r.start();
 }catch(e){if(attempt!==micEpoch)return;handsFreePaused=true;micPreparing=false;listening=false;updateMic();note(e.message);}
}
mic.addEventListener('click',()=>{
 if(listening||micPreparing||speaking||captionActive||listenTimer){handsFree.checked=false;stopListening();finishCaptions();state.textContent=token?'Holly online':'Disconnected';note('Stopped. Click Talk to Holly to resume.');updateMic();}

});
